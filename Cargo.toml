[package]
name = "connect-four-rs"
version = "0.1.0"
edition = "2024"
authors = ["Connect Four Developers"]
description = "A comprehensive Connect Four game with AI, multiplayer, tournaments, and many features"
repository = "https://github.com/connect-four/connect-four-rs"
license = "MIT"
keywords = ["game", "connect-four", "terminal", "tui"]
categories = ["games", "command-line-interface"]

[dependencies]
ratatui = "0.30.0"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
ron = "0.8"
toml = "0.8"
rand = "0.8"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
uuid = { version = "1.0", features = ["serde", "v4"] }
dashmap = "6.0"
parking_lot = "0.12"
once_cell = "1.19"
lazy_static = "1.4"
regex = "1.10"
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
num-traits = "0.2"
num-derive = "0.4"
itertools = "0.13"
bitflags = "2.6"
bytes = "1.7"
prost = "0.13"
colored = "2.1"

[dev-dependencies]
criterion = "0.5"
mockall = "0.13"
tempfile = "3.10"

[[bin]]
name = "connect-four"
path = "src/main.rs"
